name: PKR responsive browser smoke (synthetic data only)

on:
  push:
    branches:
      - codex/pkr-production-protection-20261024
    paths:
      - 'frontend/**'
      - '.github/workflows/responsive-browser.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/responsive-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-shard:
    name: browser-shard (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gameplay
            suites: room-player-merge reference-seat-sizes seat-table-experience dense-seat-layout
          - name: access-and-layout
            suites: app-experience member-access-guidance unified-player-access room-member-profiles single-header-responsive
          - name: appearance-and-updates
            suites: game-night-polish app-release-updates swipe-data-windows casino-browser
          - name: all-viewports
            suites: viewport-smoke
          - name: dashboard-overflow
            suites: dashboard-overflow
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VERCEL_ENV: preview
      NEXT_PUBLIC_PKR_ENV: staging
      NEXT_PUBLIC_API_URL: https://pkr-reloaded-worker-staging.jeemit1.workers.dev
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Validate read-only record breakdowns and tournament structures
        working-directory: frontend
        run: |
          node tests/personal-palette.cjs
          node tests/record-details.cjs
          node tests/room-payment-schedule.cjs
          node tests/payment-overview.cjs
          node tests/tournament-structure.cjs
          node tests/gameplay-safety.cjs
          node tests/seat-stack-ledger.cjs
          node tests/app-version.cjs
          node tests/page-scroll.cjs
          node tests/swipe-dismiss.cjs
      - name: Build and type-check the actual application
        working-directory: frontend
        run: npm run build
      - name: Install browser test runner without changing package lock
        working-directory: frontend
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Install isolated Chromium and WebKit test browsers
        working-directory: frontend
        run: |
          # The optional Microsoft apt feed sometimes returns HTTP 403.
          # Playwright uses Ubuntu repositories; disable this feed for CI only.
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q 'packages.microsoft.com' "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          npx playwright install --with-deps chromium webkit
      - name: Start local production-build server with staging-only configuration
        working-directory: frontend
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/pkr-viewport-next.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/install >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/pkr-viewport-next.log
          exit 1
      - name: Test records, visible popups and app layouts using synthetic API data
        working-directory: frontend
        run: |
          failed=0
          for suite in ${{ matrix.suites }}; do
            echo "::group::${suite}"
            if ! node "tests/${suite}.cjs"; then
              echo "::error::Browser suite failed: ${suite}"
              failed=1
            fi
            echo '::endgroup::'
          done
          exit "$failed"
      - name: Upload synthetic-data screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pkr-viewport-smoke-${{ matrix.name }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 5

  responsive-browser:
    if: always()
    needs: browser-shard
    runs-on: ubuntu-24.04
    steps:
      - name: Require every browser shard to pass
        env:
          RESULT: ${{ needs.browser-shard.result }}
        run: test "$RESULT" = success
