name: One-time reviewed gameplay source assembly
on:
  push:
    branches: ['fix/red-inplay-bank-figures-20261028']
    paths: ['.github/workflows/assemble-reference-source.yml']
permissions:
  contents: write
jobs:
  assemble:
    if: github.repository == 'jeemit1-art/pkr-reloaded' && github.ref == 'refs/heads/fix/red-inplay-bank-figures-20261028'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 2
      - name: Apply exact-source presentation changes without executing application code
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '5e87550af72bd0f007f7beca09c8057126f6e1a1'
          python3 frontend/scripts/apply-reference-once.py
          git diff --check
          git add 'frontend/src/app/games/[id]/play/page.tsx' frontend/scripts/compile-theme-a.cjs frontend/tests/seat-table-experience.cjs
          python3 - <<'PY'
          import subprocess
          allowed={'frontend/src/app/games/[id]/play/page.tsx','frontend/scripts/compile-theme-a.cjs','frontend/tests/seat-table-experience.cjs'}
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert changed == allowed, changed
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Unify gameplay cards and reference tools across all table sizes'
          git push origin HEAD:refs/heads/fix/red-inplay-bank-figures-20261028
          git show --stat --oneline HEAD
