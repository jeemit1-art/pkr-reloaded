name: PKR app experience - isolated source validation
on:
  push:
    branches: [fix/pwa-native-insights-metric-drilldowns-20261028]
permissions:
  contents: read
concurrency:
  group: pkr-app-experience-source
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VERCEL_ENV: preview
      NEXT_PUBLIC_PKR_ENV: staging
      NEXT_PUBLIC_API_URL: https://pkr-reloaded-worker-staging.jeemit1.workers.dev
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Require one-time feature-branch source editor
        run: test -f frontend/scripts/apply-app-experience-20261028.cjs
      - name: Install without write credentials
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Apply syntax-aware edits and test read-only record calculations
        working-directory: frontend
        run: |
          node scripts/apply-app-experience-20261028.cjs
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ['src/app/layout.tsx','src/components/PersistentNavigation.tsx']:
              p=Path(name)
              p.write_text(re.sub(r'(?m)^[ \t]+$', '', p.read_text()))
          PY
          git diff --check
          node tests/record-details.cjs
          node tests/tournament-structure.cjs
      - name: Build and type-check actual application
        working-directory: frontend
        run: npm run build
      - name: Install browser tests without altering dependency manifests
        working-directory: frontend
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Start isolated application with staging-only API configuration
        working-directory: frontend
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/pkr-app-test.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/install >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/pkr-app-test.log
          exit 1
      - name: Run focused native app and existing six-viewport regression tests
        working-directory: frontend
        run: |
          node tests/app-experience.cjs
          node tests/viewport-smoke.cjs
      - name: Prepare source-only validated patch
        run: |
          mkdir -p /tmp/pkr-validated-source
          git diff --check
          git diff --binary -- frontend > /tmp/pkr-validated-source/source.patch
          test -s /tmp/pkr-validated-source/source.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-app-source
          path: /tmp/pkr-validated-source/source.patch
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: synthetic-app-experience-screenshots
          path: artifacts/
          retention-days: 3
          if-no-files-found: ignore
  commit-validated-source:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-app-source
          path: /tmp/pkr-validated-source
      - name: Restrict the verified patch to frontend source; no dependencies executed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/pkr-validated-source/source.patch').read_text()
          paths=re.findall(r'^diff --git a/(.+?) b/(.+)$',p,re.M)
          assert paths and all(a==b and a.startswith('frontend/') and '..' not in a.split('/') for a,b in paths)
          assert not re.search(r'^new file mode 120000',p,re.M)
          PY
          git apply --check /tmp/pkr-validated-source/source.patch
          git apply /tmp/pkr-validated-source/source.patch
          git rm frontend/scripts/apply-app-experience-20261028.cjs
          git add -- frontend
          git config user.name 'PKR verified source update'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply verified native dialogs, safe navigation and clickable record breakdowns'
      - name: Fast-forward only the exact feature branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -eu
          branch='fix/pwa-native-insights-metric-drilldowns-20261028'
          test "$GITHUB_REF" = "refs/heads/$branch"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_SHA"
          printf '%s\n' '#!/bin/sh' 'case "$1" in *Username*) printf "%s\n" x-access-token;; *) printf "%s\n" "$GH_TOKEN";; esac' > "$RUNNER_TEMP/pkr-askpass"
          chmod 700 "$RUNNER_TEMP/pkr-askpass"
          GIT_ASKPASS="$RUNNER_TEMP/pkr-askpass" GIT_TERMINAL_PROMPT=0 git push origin "HEAD:refs/heads/$branch"
          rm -f "$RUNNER_TEMP/pkr-askpass"
