name: PKR WhatsApp Sharing Centre checks
on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/whatsapp-sharing-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned frontend dependencies
        run: npm ci --ignore-scripts
        working-directory: frontend
      - name: Run privacy and sharing template tests
        run: node --experimental-strip-types --test tests/whatsapp-sharing.test.mjs
        working-directory: frontend
      - name: Type-check the frontend
        run: npx tsc --noEmit
        working-directory: frontend
      - name: Verify production Next build
        run: npm run build
        working-directory: frontend
