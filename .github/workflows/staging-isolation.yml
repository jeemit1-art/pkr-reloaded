name: PKR staging isolation and Worker tests

on:
  pull_request:
    paths:
      - 'worker/**'
      - 'frontend/next.config.js'
      - '.github/workflows/staging-isolation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Check staging configuration
        run: |
          node --check worker/scripts/check-staging-config.mjs
          node worker/scripts/check-staging-config.mjs
      - name: Check test-only staging schema (in-memory)
        run: python3 worker/scripts/check-staging-schema.py
      - name: Compile route SQL against isolated staging schema
        run: python3 worker/scripts/check-staging-queries.py
      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci
      - name: Check Worker TypeScript
        working-directory: worker
        run: npm run typecheck
      - name: Run Worker unit tests
        working-directory: worker
        run: npm test
      - name: Smoke test live staging Worker and preview (read-only)
        run: |
          node --check worker/scripts/smoke-staging.mjs
          node worker/scripts/smoke-staging.mjs
