name: PKR staging isolation and Worker tests

on:
  pull_request:
    paths:
      - 'worker/**'
      - 'frontend/**'
      - '.github/workflows/staging-isolation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Check staging configuration
        run: |
          node --check worker/scripts/check-staging-config.mjs
          node worker/scripts/check-staging-config.mjs
      - name: Check test-only staging schema (in-memory)
        run: |
          python3 worker/scripts/check-staging-schema.py
          python3 worker/scripts/test-settlement-v2-migration.py
          python3 worker/scripts/test-owner-legacy-reconciliation.py
          python3 -m py_compile worker/scripts/owner-reconcile-legacy-paid.py
      - name: Test optional integrity upgrade in disposable SQLite
        run: python3 worker/scripts/check-staging-integrity-migration.py
      - name: Test RSVP board migration in disposable SQLite
        run: python3 worker/scripts/test-rsvp-board-migration.py
      - name: Test private phone membership migration in disposable SQLite
        run: python3 worker/scripts/test-phone-member-migration.py
      - name: Test read-only restored-D1 schema preflight with synthetic data
        run: python3 worker/scripts/test-restore-preflight.py
      - name: Test guarded historical-game production activation (offline synthetic data)
        run: |
          python3 -m py_compile worker/scripts/activate-live-features.py
          python3 worker/scripts/test-live-activation-guard.py
      - name: Compile route SQL against isolated staging schema
        run: python3 worker/scripts/check-staging-queries.py
      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci
      - name: Check Worker TypeScript
        working-directory: worker
        run: npm run typecheck
      - name: Run Worker unit tests
        working-directory: worker
        run: npm test
      - name: Parse browser and inlined poker scripts (no execution)
        run: node worker/scripts/check-browser-scripts.mjs

      - name: Smoke test live staging Worker and preview (read-only)
        run: |
          node --check worker/scripts/smoke-staging.mjs
          node worker/scripts/smoke-staging.mjs

  frontend-preview-build:
    # GitHub build verification is independent of Vercel plan build limits.
    # These PUBLIC staging-only values are deliberately not production URLs.
    # The build creates no deployment and cannot access Cloudflare D1.
    runs-on: ubuntu-latest
    env:
      VERCEL_ENV: preview
      NEXT_PUBLIC_PKR_ENV: staging
      NEXT_PUBLIC_API_URL: https://pkr-reloaded-worker-staging.jeemit1.workers.dev
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify frontend Preview production build
        working-directory: frontend
        run: npm run build
