name: Assemble combined PKR fixes without changing main
on:
  push:
    branches: [release/pkr-combined-fixes-20261027]
    paths: [.github/workflows/pkr-combine-release.yml]
permissions:
  contents: write
concurrency:
  group: pkr-combined-fixes-20261027
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run reviewed pinned assembly with staged-file removal correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          # Reuse the exact reviewed assembly code committed immediately before
          # this repair. Only the three obsolete files newly staged by the merge
          # need git rm -f; no user files or uncommitted work are removed.
          source=subprocess.check_output(['git','show','8a1eeea3d40b08beaa1b63487a47b569102ebb10:.github/workflows/pkr-combine-release.yml'],text=True)
          old="['git','rm','--ignore-unmatch','--',*obsolete]"
          new="['git','rm','-f','--ignore-unmatch','--',*obsolete]"
          assert source.count(old)==1
          source=source.replace(old,new)
          scripts=re.findall(r'(?ms)^        run: \|\n(.*?)(?=^      - |\Z)',source)
          assert len(scripts)==3, len(scripts)
          for number,block in enumerate(scripts,1):
              script='\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())+'\n'
              path=Path('/tmp/pkr-assembly-'+str(number)+'.sh')
              path.write_text(script)
              print('::group::Reviewed assembly phase '+str(number),flush=True)
              subprocess.run(['bash','--noprofile','--norc','-e','-o','pipefail',str(path)],check=True)
              print('::endgroup::',flush=True)
          PY
