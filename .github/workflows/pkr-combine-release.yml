name: Assemble combined PKR fixes without changing main
on:
  push:
    branches: [release/pkr-combined-fixes-20261027]
    paths: [.github/workflows/pkr-combine-release.yml]
permissions:
  contents: write
concurrency:
  group: pkr-combined-fixes-20261027
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run reviewed assembly with explicit Theme A conflict resolutions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          source=subprocess.check_output(['git','show','8a1eeea3d40b08beaa1b63487a47b569102ebb10:.github/workflows/pkr-combine-release.yml'],text=True)
          replacements={
            "['git','rm','--ignore-unmatch','--',*obsolete]":"['git','rm','-f','--ignore-unmatch','--',*obsolete]",
            "'server-authorised',":"",
            "len(selected)==6":"len(selected)==5"
          }
          # main already has a newer, robust async payment wait. Keep it rather
          # than applying the conflicting older replacement from PR 15.
          for old,new in replacements.items():
              assert source.count(old)==1, old
              source=source.replace(old,new)
          scripts=re.findall(r'(?ms)^        run: \|\n(.*?)(?=^      - |\Z)',source)
          assert len(scripts)==3, len(scripts)
          for number,block in enumerate(scripts,1):
              script='\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())+'\n'
              path=Path('/tmp/pkr-assembly-'+str(number)+'.sh')
              path.write_text(script)
              print('::group::Reviewed assembly phase '+str(number),flush=True)
              subprocess.run(['bash','--noprofile','--norc','-e','-o','pipefail',str(path)],check=True)
              print('::endgroup::',flush=True)
          PY
