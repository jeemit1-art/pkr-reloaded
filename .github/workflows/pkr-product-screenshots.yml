name: Refresh classic PKR product screenshots using synthetic browser data

on:
  push:
    branches:
      - design/pkr-classic-poker-20261027
    paths:
      - '.github/workflows/pkr-product-screenshots.yml'
      - 'frontend/src/app/pkr-classic-poker-studio.css'
      - 'frontend/src/app/layout.tsx'
      - 'frontend/src/app/page.tsx'
      - 'frontend/src/app/dashboard/**'
      - 'frontend/src/app/insights/**'
      - 'frontend/src/app/events/**'
      - 'frontend/src/app/games/**'
      - 'frontend/src/components/PersistentNavigation.tsx'
      - 'frontend/tests/viewport-smoke.cjs'

permissions:
  contents: write

jobs:
  capture-real-pkr-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERCEL_ENV: preview
      NEXT_PUBLIC_PKR_ENV: staging
      NEXT_PUBLIC_API_URL: https://pkr-reloaded-worker-staging.jeemit1.workers.dev
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Confirm approved PKR Classic Poker design
        run: |
          grep -Fq "import './pkr-classic-poker-studio.css';" frontend/src/app/layout.tsx
          ! grep -Fq "import './pkr-2026-blue-theme.css';" frontend/src/app/layout.tsx
          test -f frontend/src/app/pkr-classic-poker-studio.css
          grep -Fq 'dashboard primary control is not classic poker red' frontend/tests/viewport-smoke.cjs
          grep -Fq 'live game Share control retains gold' frontend/tests/viewport-smoke.cjs
          # Immutable gameplay: no redesign PR may alter the existing playing surface.
          git fetch origin main --depth=1
          ! git diff --name-only origin/main HEAD | grep -Fq 'frontend/src/app/games/[id]/play/page.tsx'
      - name: Install pinned frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install visual browser test runner
        working-directory: frontend
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Install isolated Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start staging-only PKR application
        working-directory: frontend
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/pkr-classic-next.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/install >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/pkr-graphite-next.log
          exit 1
      - name: Capture and test genuine PKR interface with fictional data
        working-directory: frontend
        run: node tests/viewport-smoke.cjs
      - name: Optimise real app screenshots
        working-directory: frontend
        run: node scripts/publish-demo-shots.cjs ../artifacts/viewport-smoke
      - name: Update only demonstration screenshots in design branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/design/pkr-classic-poker-20261027"
          git config user.name "PKR Screenshot Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/demo/
          if git diff --cached --quiet; then
            echo "No screenshot changes"
          else
            git commit -m "assets: authentic classic PKR screenshots with synthetic player data"
            git fetch origin design/pkr-classic-poker-20261027
            git rebase origin/design/pkr-classic-poker-20261027
            git push origin HEAD:refs/heads/design/pkr-classic-poker-20261027
          fi
