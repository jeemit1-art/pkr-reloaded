name: Refresh PKR public screenshots from redesigned app

on:
  push:
    branches:
      - design/pkr-ultraviolet-unified-20261027
    paths:
      - '.github/workflows/pkr-product-screenshots.yml'
      - 'frontend/src/app/pkr-nightshift.css'
      - 'frontend/src/app/layout.tsx'
      - 'frontend/src/app/games/[id]/play/page.tsx'

permissions:
  contents: write

jobs:
  capture-real-pkr-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERCEL_ENV: preview
      NEXT_PUBLIC_PKR_ENV: staging
      NEXT_PUBLIC_API_URL: https://pkr-reloaded-worker-staging.jeemit1.workers.dev
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Confirm PKR Nightshift design across screens
        run: |
          grep -Fq "import './pkr-nightshift.css';" frontend/src/app/layout.tsx
          ! grep -Fq "import './pkr-2026-blue-theme.css';" frontend/src/app/layout.tsx
          test -f frontend/src/app/pkr-nightshift.css
          grep -Fq 'dashboard primary control is not ultraviolet' frontend/tests/viewport-smoke.cjs
          grep -Fq 'live game Share control is not ultraviolet' frontend/tests/viewport-smoke.cjs
          grep -Fq 'nightshift-2026' frontend/src/app/pkr-nightshift.css
          grep -Fq 'Sora, Plus_Jakarta_Sans' frontend/src/app/layout.tsx
      - name: Install pinned frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install visual browser test runner
        working-directory: frontend
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Install isolated Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start staging-only PKR application
        working-directory: frontend
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/pkr-nightshift-next.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/install >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/pkr-nightshift-next.log
          exit 1
      - name: Capture and test genuine PKR interface with fictional data
        working-directory: frontend
        run: node tests/viewport-smoke.cjs
      - name: Optimise real app screenshots
        working-directory: frontend
        run: node scripts/publish-demo-shots.cjs ../artifacts/viewport-smoke
      - name: Update only demonstration screenshots in design branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/design/pkr-ultraviolet-unified-20261027"
          git config user.name "PKR Screenshot Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/demo/
          if git diff --cached --quiet; then
            echo "No screenshot changes"
          else
            git commit -m "assets: genuine Nightshift PKR UI screenshots with fictional player data"
            git fetch origin design/pkr-ultraviolet-unified-20261027
            git rebase origin/design/pkr-ultraviolet-unified-20261027
            git push origin HEAD:refs/heads/design/pkr-ultraviolet-unified-20261027
          fi
