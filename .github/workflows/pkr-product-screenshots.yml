name: Refresh PKR product screenshots (fictional data only)

on:
  push:
    branches:
      - design/charcoal-blue-refresh-20261027
    paths:
      - '.github/workflows/pkr-product-screenshots.yml'

permissions:
  contents: write
  actions: read

jobs:
  refresh-demo-captures:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Confirm final theme and known synthetic browser capture
        run: |
          grep -Fq "import './pkr-2026-graphite.css';" frontend/src/app/layout.tsx
          ! grep -Fq "import './pkr-2026-blue-theme.css';" frontend/src/app/layout.tsx
          test -f frontend/src/app/pkr-2026-graphite.css
      - name: Install pinned application image optimiser
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Retrieve genuine PKR screenshots with fictional data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pkr-capture"
          # Captured on the graphite-design branch with realistic fictional fixtures.
          # Run 40414528436 ran full browser scenarios. Its only test failure was an
          # obsolete expected initial, fixed in the current branch before publishing.
          gh run download 40414528436 \
            --repo jeemit1-art/pkr-reloaded \
            --name pkr-viewport-smoke \
            --dir "$RUNNER_TEMP/pkr-capture"
          test -f "$RUNNER_TEMP/pkr-capture/desktop-live-table.png"
          test -f "$RUNNER_TEMP/pkr-capture/phone-insights.png"
      - name: Optimise screenshots from the actual app
        working-directory: frontend
        run: node scripts/publish-demo-shots.cjs "$RUNNER_TEMP/pkr-capture"
      - name: Commit refreshed public assets to design branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/design/charcoal-blue-refresh-20261027"
          git config user.name "PKR Screenshot Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/demo/
          if git diff --cached --quiet; then
            echo "Product screenshot assets already current"
          else
            git commit -m "assets: real graphite PKR screens with fictional sample data"
            git fetch origin design/charcoal-blue-refresh-20261027
            git rebase origin/design/charcoal-blue-refresh-20261027
            git push origin HEAD:refs/heads/design/charcoal-blue-refresh-20261027
          fi
