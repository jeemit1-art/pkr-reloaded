name: Refresh PKR product screenshots (fictional data only)

on:
  push:
    branches:
      - design/charcoal-blue-refresh-20261027
    paths:
      - '.github/workflows/pkr-product-screenshots.yml'

permissions:
  contents: write

jobs:
  refresh-demo-captures:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERCEL_ENV: preview
      NEXT_PUBLIC_PKR_ENV: staging
      NEXT_PUBLIC_API_URL: https://pkr-reloaded-worker-staging.jeemit1.workers.dev
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Confirm no obsolete theme is imported
        run: |
          grep -Fq "import './pkr-2026-graphite.css';" frontend/src/app/layout.tsx
          test -f frontend/src/app/pkr-2026-graphite.css
          ! grep -Fq "import './pkr-2026-blue-theme.css';" frontend/src/app/layout.tsx
      - name: Install application dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install visual test browser without changing lockfile
        working-directory: frontend
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Install isolated Chromium browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start local Next.js server (staging only)
        working-directory: frontend
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/pkr-visual-server.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/install > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/pkr-visual-server.log
          exit 1
      - name: Test and capture real app UI with synthetic fixtures
        working-directory: frontend
        run: node tests/viewport-smoke.cjs
      - name: Publish screenshots with current PKR theme
        working-directory: frontend
        run: node scripts/publish-demo-shots.cjs ../artifacts/viewport-smoke
      - name: Commit only publicly safe product screenshots
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/design/charcoal-blue-refresh-20261027"
          git config user.name "PKR Screenshot Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/demo/
          if git diff --cached --quiet; then
            echo "Screenshots already match current theme"
          else
            git commit -m "assets: refresh authentic PKR screens in graphite theme"
            git fetch origin design/charcoal-blue-refresh-20261027
            git rebase origin/design/charcoal-blue-refresh-20261027
            git push origin HEAD:refs/heads/design/charcoal-blue-refresh-20261027
          fi
