name: Refresh verified Midnight Felt product screenshots
on:
  push:
    branches: [design/theme-a-midnight-felt-20261027]
    paths: ['.github/workflows/pkr-product-screenshots.yml', 'frontend/src/**', 'frontend/scripts/**', 'frontend/tests/**', 'frontend/package.json', 'frontend/package-lock.json']
concurrency:
  group: theme-a-screenshots
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  capture-real-pkr-ui:
    if: github.ref == 'refs/heads/design/theme-a-midnight-felt-20261027'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VERCEL_ENV: preview
      NEXT_PUBLIC_PKR_ENV: staging
      NEXT_PUBLIC_API_URL: https://pkr-reloaded-worker-staging.jeemit1.workers.dev
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply reviewed design-only source migration
        run: |
          if test -f frontend/scripts/repair-theme-a-source.cjs; then
            node frontend/scripts/repair-theme-a-source.cjs
            rm frontend/scripts/repair-theme-a-source.cjs
          fi
          grep -Fq "import './pkr-theme-a.css';" frontend/src/app/layout.tsx
          grep -Fq '#3DDC97' frontend/src/app/pkr-theme-a-tokens.css
          node --check frontend/tests/viewport-smoke.cjs
      - name: Install locked dependencies and pinned browser
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build exact application, including the consolidated Theme A cascade
        working-directory: frontend
        run: npm run build
      - name: Start isolated optimised app
        working-directory: frontend
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/pkr-theme-a-next.log 2>&1 &
          echo $! > /tmp/pkr-theme-a-next.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/install >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/pkr-theme-a-next.log
          exit 1
      - name: Capture actual app screens with seven fictional players
        working-directory: frontend
        run: node scripts/capture-theme-a.cjs app
      - name: Generate fresh product images and source manifest
        working-directory: frontend
        run: node scripts/publish-demo-shots.cjs ../artifacts/theme-a-capture
      - name: Restart preview with fresh public assets
        working-directory: frontend
        run: |
          fuser -k 3000/tcp || true
          npm run start -- --hostname 127.0.0.1 >> /tmp/pkr-theme-a-next.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/demo/theme-a/manifest.json >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify public pages show this build, not old screenshots
        working-directory: frontend
        run: node scripts/capture-theme-a.cjs marketing
      - name: Test full app at six screen sizes
        working-directory: frontend
        run: node tests/viewport-smoke.cjs
      - name: Package reviewed source only, with no credentials or environment files
        if: always()
        run: |
          mkdir -p artifacts
          tar -czf artifacts/theme-a-reviewed-source.tar.gz frontend/src frontend/scripts frontend/tests frontend/public frontend/package.json frontend/package-lock.json frontend/next.config.js frontend/postcss.config.js frontend/tailwind.config.js frontend/tsconfig.json
      - name: Save screenshot and colour-check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pkr-theme-a-visual-evidence
          path: |
            artifacts/theme-a-capture/
            artifacts/viewport-smoke/
            artifacts/theme-a-reviewed-source.tar.gz
            frontend/public/demo/theme-a/
            /tmp/pkr-theme-a-next.log
          if-no-files-found: error
          retention-days: 2
      - name: Commit tested source and fresh assets to design branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/design/theme-a-midnight-felt-20261027'
          test "$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA" || { echo 'Source changed during capture; refusing stale publication.'; exit 1; }
          git config user.name 'PKR Screenshot Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/ frontend/scripts/ frontend/tests/ frontend/public/demo/theme-a/ frontend/public/design-version.json frontend/package.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: verified Midnight Felt cascade and fresh actual-app screenshots'
          gh auth setup-git
          git push origin HEAD:refs/heads/design/theme-a-midnight-felt-20261027
