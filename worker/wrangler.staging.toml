# PKR STAGING ONLY. Do not replace or edit worker/wrangler.toml.
# Every binding below points to a dedicated staging resource.
account_id = "4b4794b983d6966f4207d2ff4fd8c991"
name = "pkr-reloaded-worker-staging"
main = "src/index.ts"
compatibility_date = "2024-05-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
# Preserve bindings managed through the Cloudflare dashboard across staging deploys.
keep_vars = true

[[kv_namespaces]]
binding = "KV"
id = "9e86adbcfb5d4817a32dfd4482d3dbf9"

[[d1_databases]]
binding = "DB"
database_name = "pkr-reloaded-db-staging"
database_id = "03577857-fc94-49ed-bd1b-5cd658aa0978"

[vars]
PKR_ENV = "staging"
# Public OAuth client ID; keep the Google CLIENT SECRET and JWT SECRET in Cloudflare Secrets only.
GOOGLE_CLIENT_ID = "385656194684-ost4dd5uumdphq17v5ostvu2ohqrrfgf.apps.googleusercontent.com"
# Stable Vercel branch preview alias verified 26 Nov 2026; staging-only.
# Must be deployed to the STAGING Worker by an authorised account operator.
# Never modify production Worker bindings for this review.
FRONTEND_URL = "https://pkr-reloaded-git-codex-pkr-unified-f830c3-jeemit1-arts-projects.vercel.app"

# No production routes, cron triggers, secrets or production bindings.

# Preview builds are isolated from the production Worker and use staging-only resources.
# Previews sharing these IDs also share STAGING data; do not use real player records here.
[previews]

[[previews.kv_namespaces]]
binding = "KV"
id = "9e86adbcfb5d4817a32dfd4482d3dbf9"

[[previews.d1_databases]]
binding = "DB"
database_name = "pkr-reloaded-db-staging"
database_id = "03577857-fc94-49ed-bd1b-5cd658aa0978"

[previews.vars]
PKR_ENV = "staging"
GOOGLE_CLIENT_ID = "385656194684-ost4dd5uumdphq17v5ostvu2ohqrrfgf.apps.googleusercontent.com"
FRONTEND_URL = "https://pkr-reloaded-git-codex-pkr-unified-f830c3-jeemit1-arts-projects.vercel.app"
